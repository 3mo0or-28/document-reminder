const msg=d=>{const l=left(d.exp),n=d.name;return l<0?`Your ${n} has expired.`:l==0?`Your ${n} expires today.`:l==1?`Your ${n} expires tomorrow.`:l<=7?`Your ${n} expires in ${l} days — next week.`:`Your ${n} expires in ${l} days.`};
function note(d,t){S.notifs.unshift({id:uid(),t,doc:d.id,at:Date.now(),read:0});if('Notification'in window&&Notification.permission=='granted')try{new Notification('Vaulta',{body:t})}catch(e){}}
function check(){let c=0;S.docs.forEach(d=>{const l=left(d.exp);d.rem.forEach(r=>{if(!r.fired&&fireAt(d,r)<=new Date()){r.fired=1;if(l>=0){note(d,msg(d));c++}}});if(l<0&&!d.expN){d.expN=1;note(d,msg(d));c++}});if(c){save();bell()}}
const unread=()=>S.notifs.filter(n=>!n.read).length,bell=()=>{document.querySelectorAll('.bc').forEach(e=>{const u=unread();e.textContent=u;e.style.display=u?'':'none'})};
const fn=id=>(S.folders.find(f=>f.id==id)||{name:'Other'}).name;
/* auth */
function authView(mode='in',err=''){$('#root').innerHTML=`<div class="auth"><div class="card"><div class="logo" style="padding:0 0 6px"><i>V</i>Vaulta</div><p class="sub">Your documents are safe and organized.</p>${err?`<div class="pill expired" style="display:block;border-radius:10px;margin-bottom:8px">${H(err)}</div>`:''}${mode=='up'?'<label>Name</label><input id="an" maxlength="60" autocomplete="name">':''}<label>Email</label><input id="ae" type="email" autocomplete="email"><label>Password ${mode=='up'?'(min 8 characters)':''}</label><input id="ap" type="password" autocomplete="${mode=='up'?'new-password':'current-password'}"><button class="btn" id="go" style="width:100%;justify-content:center;margin-top:18px">${mode=='up'?'Create account':'Sign in'}</button><p class="sub" style="text-align:center;margin:16px 0 0">${mode=='up'?'Have an account?':'New here?'} <a href="#" id="sw" style="color:var(--ac)">${mode=='up'?'Sign in':'Create account'}</a></p></div></div>`;

$('#go').onclick=async()=>{const e=$('#ae').value.trim().toLowerCase(),p=$('#ap').value,us=users();if(!/^\S+@\S+\.\S+$/.test(e))return authView(mode,'Enter a valid email.');
if(mode=='up'){const n=$('#an').value.trim();if(!n)return authView(mode,'Please enter your name.');if(p.length<8)return authView(mode,'Password must be at least 8 characters.');if(us[e])return authView(mode,'An account with this email already exists.');
const salt=btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));us[e]={id:uid(),name:n,email:e,salt,h:await hash(p,salt)};localStorage.setItem('vd_users',JSON.stringify(us));U=us[e];await seed()}
else{const u=us[e];if(!u||u.h!==await hash(p,u.salt))return authView(mode,'Incorrect email or password.');U=u}
localStorage.setItem('vd_sess',U.id);boot()}}
async function boot(){if(!S||S.uid!=U.id){S=JSON.parse(localStorage.getItem('vd:'+U.id)||'null');if(!S)await seed()}S.uid=U.id;applyTheme();shell();check();setInterval(check,60000)}
function applyTheme(){document.documentElement.dataset.theme=S.set.theme}
/* shell */
const NAV=[['dash','Dashboard','dash'],['docs','Documents','docs'],['folders','Folders','folders'],['cal','Calendar','cal'],['notifs','Notifications','bell'],['set','Settings','set']];
function shell(){$('#root').innerHTML=`<div class="app"><aside><div class="logo"><i>V</i>Vaulta</div>${NAV.map(n=>`<button class="nav" data-v="${n[0]}" onclick="go('${n[0]}')">${I(n[2])}<span class="l">${n[1]}</span>${n[0]=='notifs'?'<span class="badge bc hb"></span>':''}</button>`).join('')}<div class="me"><div class="av">${H(U.name[0].toUpperCase())}</div><div style="min-width:0"><b>${H(U.name)}</b><br><small style="color:var(--mu);overflow:hidden;text-overflow:ellipsis;display:block">${H(U.email)}</small></div></div></aside><main><div class="top"><div class="search">${I('s')}<input id="gs" placeholder="Search name, type, number or folder" value="${H(ui.q)}"></div><div class="ib" onclick="go('notifs')">${I('bell')}<span class="badge bc"></span></div><button class="btn" onclick="docForm()">＋ <span class="hb">Add Document</span></button></div><div id="v"></div></main></div>`;
$('#gs').oninput=e=>{ui.q=e.target.value;if(ui.v!='docs'){ui.v='docs';ui.f='all';ui.folder='';nav()}render()};bell();go(ui.v)}
function nav(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v==ui.v))}
function go(v){ui.v=v;if(v=='docs'&&!$('#gs').value)ui.folder=ui.folder;nav();$('#v').innerHTML='<div class="grid g4"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>';setTimeout(render,120)}
const render=()=>{const v=$('#v');if(!v)return;v.innerHTML=VIEWS[ui.v]();v.style.animation='none';v.offsetHeight;v.style.animation='';bell()};
/* views */
var card=d=>{const s=st(d.exp),p=d.rem.filter(r=>!r.fired).length;return `<div class="card doc" onclick="openDoc('${d.id}')"><div class="ic">${ico(d.cat)}</div><div class="gr"><b>${H(d.name)}</b><br><small>${H(d.cat)} · ${H(fn(d.folder))}</small></div><span class="pill ${s}">${LB[s]}</span><div class="meta"><span>📅 ${fmt(d.exp)}</span><span>${dt(left(d.exp))}</span><span>🔔 ${p?p+' reminder'+(p>1?'s':'')+' scheduled':d.rem.length?'All sent':'No reminders'}</span></div></div>`};
var empty=(t,s,b)=>`<div class="empty"><div>🗂️</div><b>${t}</b>${s}${b?`<br><br><button class="btn" onclick="docForm()">＋ Add Document</button>`:''}</div>`;
const VIEWS={
dash(){const D=S.docs,c=k=>D.filter(d=>st(d.exp)==k).length,h=new Date().getHours(),g=h<12?'Good Morning':h<18?'Good Afternoon':'Good Evening',up=[...D].filter(d=>left(d.exp)>=0).sort((a,b)=>a.exp.localeCompare(b.exp)).slice(0,5);
return `<h1>${g}, ${H(U.name.split(' ')[0])}</h1><p class="sub">Your documents are safe and organized.</p><div class="grid g4">${[['Total Documents',D.length,'var(--ac)'],['Expiring Soon',c('soon'),COL.soon],['Expired',c('expired'),COL.expired],['Active Documents',c('active'),COL.active]].map(x=>`<div class="card stat"><i style="background:${x[2]}"></i><b>${x[1]}</b><span>${x[0]}</span></div>`).join('')}</div><h2>Upcoming Expirations</h2>${up.length?`<div class="grid g3">${up.map(card).join('')}</div>`:empty('No documents yet.','Add your first document to start tracking expiration dates.',1)}`},
docs(){let L=S.docs.filter(d=>{const q=ui.q.toLowerCase();return(ui.f=='all'||st(d.exp)==ui.f)&&(!ui.folder||d.folder==ui.folder)&&(!q||[d.name,d.cat,d.num,fn(d.folder)].some(x=>(x||'').toLowerCase().includes(q)))});
L.sort((a,b)=>ui.s=='name'?a.name.localeCompare(b.name):ui.s=='new'?b.added-a.added:a.exp.localeCompare(b.exp));
return `<div class="row sp"><h1>${ui.folder?H(fn(ui.folder)):'Documents'}</h1>${ui.folder?'<button class="btn g s" onclick="ui.folder=\'\';render()">Clear folder filter</button>':''}</div><p class="sub">${L.length} document${L.length==1?'':'s'}</p><div class="row sp" style="margin-bottom:16px"><div class="row">${[['all','All'],['active','Active'],['soon','Expiring Soon'],['expired','Expired']].map(f=>`<button class="chip ${ui.f==f[0]?'on':''}" onclick="ui.f='${f[0]}';render()">${f[1]}</button>`).join('')}</div><select style="width:auto" onchange="ui.s=this.value;render()"><option value="exp" ${ui.s=='exp'?'selected':''}>Sort: Expiry date</option><option value="name" ${ui.s=='name'?'selected':''}>Sort: Name</option><option value="new" ${ui.s=='new'?'selected':''}>Sort: Recently added</option></select></div>${L.length?`<div class="grid g3">${L.map(card).join('')}</div>`:S.docs.length?empty('No matching documents.','Try a different search or filter.'):empty('No documents yet.','Add your first document to start tracking expiration dates.',1)}`},
folders(){return `<div class="row sp"><h1>Folders</h1><button class="btn" onclick="folderNew()">＋ New Folder</button></div><p class="sub">Organize documents the way you think.</p><div class="grid g3">${S.folders.map(f=>{const n=S.docs.filter(d=>d.folder==f.id).length;return `<div class="card"><div style="cursor:pointer" onclick="ui.folder='${f.id}';ui.f='all';ui.q='';$('#gs').value='';go('docs')"><div class="ic" style="margin-bottom:12px">📁</div><b>${H(f.name)}</b><br><small style="color:var(--mu)">${n} Document${n==1?'':'s'}</small></div><div class="row" style="margin-top:12px"><button class="btn g s" onclick="folderRen('${f.id}')">Rename</button>${f.id!='other'?`<button class="btn g s" onclick="folderDel('${f.id}')">Delete</button>`:''}</div></div>`}).join('')}</div>`},
cal(){const m=ui.cm,y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),by={};S.docs.forEach(d=>(by[d.exp]=by[d.exp]||[]).push(d));
let c=['S','M','T','W','T','F','S'].map(x=>`<div class="h">${x}</div>`).join('')+'<span></span>'.repeat(first);
for(let i=1;i<=n;i++){const k=`${y}-${pad(mo+1)}-${pad(i)}`,ds=by[k]||[];c+=`<div class="${k==iso(new Date())?'td':''} ${ui.sel==k?'sel':''}" onclick="ui.sel='${k}';render()">${i}<span class="dots">${ds.map(d=>`<i style="background:${COL[st(d.exp)]}"></i>`).join('')}</span></div>`}
const sel=ui.sel&&by[ui.sel]||[];
return `<div class="row sp"><h1>Calendar</h1><div class="row"><button class="btn g s" onclick="ui.cm=new Date(${y},${mo-1},1);render()">‹</button><b>${m.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</b><button class="btn g s" onclick="ui.cm=new Date(${y},${mo+1},1);render()">›</button></div></div><p class="sub"><span class="pill active">Active</span> <span class="pill soon">Expiring Soon</span> <span class="pill expired">Expired</span></p><div class="card"><div class="cal">${c}</div></div>${ui.sel?`<h2>${fmt(ui.sel)}</h2>${sel.length?`<div class="grid g3">${sel.map(card).join('')}</div>`:'<p class="sub">No documents expire on this date.</p>'}`:''}`},
notifs(){const N=S.notifs;return `<div class="row sp"><h1>Notifications</h1><div class="row"><button class="btn g s" onclick="S.notifs.forEach(n=>n.read=1);save();render()">Mark all read</button>${N.length?'<button class="btn g s" onclick="clearN()">Clear all</button>':''}</div></div><p class="sub">${unread()} unread</p>${N.length?N.map(n=>`<div class="card nt ${n.read?'':'un'}"><p ${n.doc?`style="cursor:pointer" onclick="openDoc('${n.doc}')"`:''}>${H(n.t)}<br><small>${new Date(n.at).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})}</small></p><button class="btn g s" onclick="togN('${n.id}')">${n.read?'Mark unread':'Mark read'}</button><button class="btn g s" onclick="delN('${n.id}')">Delete</button></div>`).join(''):empty('All caught up.','Reminders will appear here as expiry dates approach.')}`},
set(){const s=S.set,P=[1,3,7,14,30,60,90];return `<h1>Settings</h1><p class="sub">Make Vaulta yours.</p><div class="card"><h2 style="margin-top:0">Profile</h2><label>Name</label><input id="sn" value="${H(U.name)}" maxlength="60"><label>Email</label><input value="${H(U.email)}" disabled><br><button class="btn s" onclick="saveName()">Save profile</button></div><div class="card" style="margin-top:14px"><h2 style="margin-top:0">Notifications & default reminders</h2><p class="sub" style="margin:0 0 10px">Automatically remind me (applied to new documents):</p><div class="row">${P.map(n=>`<button class="chip ${s.defRem.includes(n)?'on':''}" onclick="togDef(${n})">${n} day${n>1?'s':''} before</button>`).join('')}</div><br><button class="btn g s" onclick="reqN()">Enable system notifications (${'Notification'in window?Notification.permission:'unsupported'})</button></div><div class="card" style="margin-top:14px"><h2 style="margin-top:0">Appearance</h2><div class="f2"><div><label>Theme</label><select onchange="S.set.theme=this.value;save();applyTheme()">${['light','dark','system'].map(t=>`<option value="${t}" ${s.theme==t?'selected':''}>${t[0].toUpperCase()+t.slice(1)} mode</option>`).join('')}</select></div><div><label>Date format</label><select onchange="S.set.df=this.value;save();render()"><option value="long" ${s.df=='long'?'selected':''}>15 December 2026</option><option value="short" ${s.df=='short'?'selected':''}>15/12/2026</option><option value="iso" ${s.df=='iso'?'selected':''}>2026-12-15</option></select></div></div></div><div class="card" style="margin-top:14px"><h2 style="margin-top:0">Security</h2><div class="f2"><div><label>New password</label><input id="np" type="password" autocomplete="new-password"></div><div><label>&nbsp;</label><button class="btn g" onclick="chPw()">Change password</button></div></div><br><button class="btn d s" onclick="signOut()">Sign out</button></div>`}};
/* actions */
const togDef=n=>{const a=S.set.defRem;S.set.defRem=a.includes(n)?a.filter(x=>x!=n):[...a,n].sort((x,y)=>x-y);save();render()};

async function chPw(){const p=$('#np').value;if(p.length<8)return toast('Password must be at least 8 characters.',1);const us=users(),salt=btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));us[U.email].salt=salt;us[U.email].h=await hash(p,salt);U=us[U.email];localStorage.setItem('vd_users',JSON.stringify(us));$('#np').value='';toast('Password changed successfully.')}

const togN=id=>{const n=S.notifs.find(n=>n.id==id);n.read=!n.read;save();render()};

async function openDoc(id){const d=S.docs.find(x=>x.id==id);if(!d)return;const s=st(d.exp),f=await getF(id);let pv='<p class="sub">No file attached.</p>',url='';
if(f){url=URL.createObjectURL(f.blob);pv=f.type=='application/pdf'?`<iframe class="prev" src="${url}"></iframe>`:`<img class="prev" src="${url}" alt="Preview">`}

let dr;

openM(`<h2 style="margin-top:0">${d?'Edit Document':'Add Document'}</h2><label>Document Name *</label><input id="fn" maxlength="80" value="${H(d?.name)}"><div class="f2"><div><label>Category</label><select id="fc">${CATS.map(c=>`<option ${d&&d.cat==c[0]?'selected':''}>${c[0]}</option>`).join('')}</select></div><div><label>Folder</label><select id="ff">${S.folders.map(f=>`<option value="${f.id}" ${d&&d.folder==f.id?'selected':''}>${H(f.name)}</option>`).join('')}</select></div></div><label>Document Number (optional)</label><input id="fu" maxlength="60" value="${H(d?.num)}"><div class="f2"><div><label>Issue Date</label><input id="fi" type="date" value="${d?.issue||''}"></div><div><label>Expiry Date *</label><input id="fe" type="date" value="${d?.exp||''}" onchange="rp()"></div></div><label>Remind me</label><div class="row">${[1,3,7,14,30,60,90].map(n=>`<button type="button" class="chip ${dr.pre.has(n)?'on':''}" data-n="${n}" onclick="tp(${n},this)">${n} day${n>1?'s':''} before</button>`).join('')}</div><div class="row" style="margin-top:10px"><input id="fcu" type="datetime-local" style="flex:1"><button type="button" class="btn g s" onclick="addCu()">Add custom</button></div><div id="rl" style="margin-top:10px;font-size:13px"></div><label>Notes (optional)</label><textarea id="fo" rows="2" maxlength="500">${H(d?.notes)}</textarea><label>Upload Document (PDF, JPG, PNG · max 10 MB)</label><input id="ffl" type="file" accept=".pdf,.jpg,.jpeg,.png" onchange="pf(this)"><div id="pv" style="margin-top:10px"></div><div class="row" style="justify-content:flex-end;margin-top:20px"><button class="btn g" onclick="closeM()">Cancel</button><button class="btn" onclick="saveDoc()">${d?'Save changes':'Add Document'}</button></div>`);rp()}
const tp=(n,b)=>{dr.pre.has(n)?dr.pre.delete(n):dr.pre.add(n);b.classList.toggle('on');rp()};

function rp(){const e=$('#fe').value,a=[...dr.pre].sort((x,y)=>y-x).map(n=>`<div>🔔 ${n} day${n>1?'s':''} before${e?' — '+fmt(addD(e,-n)):''}</div>`).concat(dr.cu.map((c,i)=>`<div>🔔 Custom — ${new Date(c).toLocaleString('en-GB',{dateStyle:'medium',timeStyle:'short'})} <a href="#" onclick="dr.cu.splice(${i},1);rp();return false" style="color:var(--er)">remove</a></div>`));$('#rl').innerHTML=a.length?'<b>Reminder schedule</b>'+a.join(''):'<span style="color:var(--mu)">No reminders selected.</span>'}
async function pf(el){const f=el.files[0],e=okF(f),p=$('#pv');dr.file=null;p.innerHTML='';if(!f)return;if(e){el.value='';return toast(e,1)}dr.file=f;const u=URL.createObjectURL(f);p.innerHTML=f.type=='application/pdf'?`<iframe class="prev" src="${u}"></iframe>`:`<img class="prev" src="${u}" alt="Preview">`}
async function saveDoc(){const name=$('#fn').value.trim(),exp=$('#fe').value,issue=$('#fi').value;if(!name)return toast('Please enter a document name.',1);if(!exp)return toast('Please choose an expiry date.',1);if(issue&&issue>exp)return toast('Issue date must be before expiry date.',1);

async function start(s){if(started)return;started=1;U={id:s.user.id,email:s.user.email,name:''};try{await loadAll()}catch(e){started=0;return authView('in','We could not load your account. Please try again.')}applyTheme();shell();clearInterval(pollT);pollT=setInterval(poll,60000)}
authView=(mode='in',err='',msg='')=>{const T={in:'Sign in',up:'Create account',forgot:'Send reset link',reset:'Set new password'},g=id=>document.getElementById(id);
$('#root').innerHTML=`<div class="auth"><div class="card"><div class="logo" style="padding:0 0 6px"><i>V</i>Vaulta</div><p class="sub">Your documents are safe and organized.</p>${err?`<div class="pill expired" style="display:block;border-radius:10px;margin-bottom:8px">${H(err)}</div>`:''}${msg?`<div class="pill active" style="display:block;border-radius:10px;margin-bottom:8px">${H(msg)}</div>`:''}${mode=='up'?'<label>Name</label><input id="an" maxlength="60" autocomplete="name">':''}${mode!='reset'?'<label>Email</label><input id="ae" type="email" autocomplete="email">':''}${mode!='forgot'?`<label>${mode=='reset'?'New password':'Password'} ${mode!='in'?'(min 8 characters)':''}</label><input id="ap" type="password" autocomplete="${mode=='in'?'current-password':'new-password'}">`:''}<button class="btn" id="go" style="width:100%;justify-content:center;margin-top:18px">${T[mode]}</button><p class="sub" style="text-align:center;margin:16px 0 0">${mode=='in'?'<a href="#" id="s1" style="color:var(--ac)">Forgot password?</a> · <a href="#" id="s2" style="color:var(--ac)">Create account</a>':'<a href="#" id="s2" style="color:var(--ac)">Back to sign in</a>'}</p></div></div>`;
if(g('s1'))g('s1').onclick=e=>{e.preventDefault();authView('forgot')};g('s2').onclick=e=>{e.preventDefault();authView(mode=='in'?'up':'in')};
g('go').onclick=async()=>{const e=g('ae')?.value.trim().toLowerCase(),p=g('ap')?.value||'',b=g('go');if(mode!='reset'&&!/^\S+@\S+\.\S+$/.test(e||''))return authView(mode,'Enter a valid email.');if(mode!='in'&&mode!='forgot'&&p.length<8)return authView(mode,'Password must be at least 8 characters.');if(mode=='up'&&!g('an').value.trim())return authView(mode,'Please enter your name.');
b.disabled=true;b.innerHTML='<i class="sp2"></i> Please wait';
try{if(mode=='up'){const r=await sb.auth.signUp({email:e,password:p,options:{data:{name:g('an').value.trim(),tz:Intl.DateTimeFormat().resolvedOptions().timeZone}}});if(r.error)throw r.error;if(!r.data.session)return authView('in','','Account created. Check your email to confirm it, then sign in.')}
else if(mode=='in'){ok(await sb.auth.signInWithPassword({email:e,password:p}))}
else if(mode=='forgot'){await sb.auth.resetPasswordForEmail(e,{redirectTo:location.origin+location.pathname});return authView('in','','If that email has an account, a reset link is on its way.')}
else{ok(await sb.auth.updateUser({password:p}));recov=false;history.replaceState(null,'',location.pathname);const r=await sb.auth.getSession();if(r.data.session)start(r.data.session)}}
catch(x){authView(mode,mode=='in'?'Incorrect email or password.':'We could not complete that. Please check your details and try again.')}}};
if(sb)sb.auth.onAuthStateChange((ev,s)=>{setTimeout(()=>{if(ev=='PASSWORD_RECOVERY'){recov=true;authView('reset')}else if((ev=='SIGNED_IN'||ev=='INITIAL_SESSION')&&s&&!recov)start(s);else if(ev=='INITIAL_SESSION'&&!s)authView('in');else if(ev=='SIGNED_OUT'){started=0;S=null;clearInterval(pollT);authView('in','','You have been signed out.')}},0)});
signOut=()=>sb.auth.signOut();
async function chPw(){const p=$('#np').value;if(p.length<8)return toast('Password must be at least 8 characters.',1);const r=await sb.auth.updateUser({password:p});if(r.error)return toast("We couldn't change your password. Please try again.",1);$('#np').value='';toast('Password changed successfully.')}
saveName=async()=>{const v=$('#sn').value.trim();if(!v)return toast('Name cannot be empty.',1);const r=await sb.from('profiles').update({name:v}).eq('id',U.id);if(r.error)return toast("We couldn't update your profile. Please try again.",1);U.name=v;toast('Profile updated successfully.');shell()};
async function delAcct(){if(!await ask('This permanently deletes your account, documents, files, folders and reminders. This cannot be undone.','Delete my account'))return;try{const l=ok(await sb.storage.from('docs').list(U.id,{limit:1000}));if(l.length)ok(await sb.storage.from('docs').remove(l.map(x=>`${U.id}/${x.name}`)));ok(await sb.rpc('delete_my_account'))}catch(e){return toast("We couldn't delete your account. Please try again.",1)}await sb.auth.signOut().catch(()=>{});started=0;S=null;clearInterval(pollT);authView('in','','Your account has been deleted.')}
const _s=VIEWS.set;VIEWS.set=()=>_s()+`<div class="card" style="margin-top:14px"><h2 style="margin-top:0">Email reminders</h2><label style="display:flex;gap:10px;align-items:center;font-weight:400"><input type="checkbox" style="width:auto" ${S.set.email?'checked':''} onchange="S.set.email=this.checked;save()"> Queue reminders for email (email sending is not active yet)</label></div><div class="card" style="margin-top:14px"><h2 style="margin-top:0">Delete account</h2><p class="sub" style="margin-top:0">Permanently removes your data and files.</p><button class="btn d s" onclick="delAcct()">Delete my account</button></div>`;
addEventListener('offline',()=>toast('You are offline. Changes will not save until you reconnect.',1));addEventListener('focus',poll);
addEventListener('unhandledrejection',e=>{e.preventDefault();toast('Something went wrong. Please try again.',1)});
</script>
</body></html>
